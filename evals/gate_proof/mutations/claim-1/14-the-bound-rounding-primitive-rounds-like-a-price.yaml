# `Money.as_lower_bound` is the single primitive every floor in the envelope is rounded by,
# and a review found the eval's own `_exact_floor` calling it — so on that path the eval's
# floor and the core's floor were the same number arrived at once.
#
# What that actually cost, planted against `main` rather than reasoned about: G2 FAILS, with
# 199 violations in 28,681 certified prices, because G2 compares against `reference`'s exact
# `Decimal` bound and that never went through `Money`'s rounding. G3 and G4 stay green. The
# check that shared the primitive was G6, and G6 stayed green while its published ceiling
# count moved 7,366 -> 7,365 in silence. An earlier version of this header claimed all three
# stayed green; it was wrong, and it had not been run.
#
# G6 does not catch this even now: the ladder is handed the eval's floor, which is the
# *higher* of the two once the core's is loosened, so its quotes clear the core's floor
# comfortably. G10 is named because it compares the two floors directly, on every case,
# without waiting for a price to land in the one-cent gap.

id:          the-bound-rounding-primitive-rounds-like-a-price
claim:       1
eval_module: evals.guardrail
targets:
  - G10.bounds-land-where-the-independent-arithmetic-puts-them

breaks: >-
  the primitive every floor in the envelope is rounded by rounds half-to-even, like a price,
  instead of up, like a bound. Every lower bound in the system moves down by up to half a
  cent at once, and a bound that rounds toward what it forbids admits prices below itself.

file: src/holdout/core/money.py

anchor: |
      @classmethod
      def as_lower_bound(cls, cents: Decimal | int | str) -> Money:
          """Round a number of cents up. A floor never rounds down into what it forbids."""
          return cls(_quantise(cents, ROUND_CEILING))
replacement: |
      @classmethod
      def as_lower_bound(cls, cents: Decimal | int | str) -> Money:
          """Round a number of cents up. A floor never rounds down into what it forbids."""
          return cls(_quantise(cents, ROUND_HALF_EVEN))
