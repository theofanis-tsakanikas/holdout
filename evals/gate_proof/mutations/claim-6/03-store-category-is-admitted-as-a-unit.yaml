# along categories inside one store, and the contract declares cross-price substitution --
# the arms share customers by construction. Admitting it is the change a session makes when
# an agent keeps proposing it and every refusal reads as the engine being difficult. The
# recording holds exactly such a design, and with this change the engine stops refusing it.
#
