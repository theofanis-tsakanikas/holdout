# The gate.
#
# CLAUDE.md: "On a branch, the suite runs *before* anything lands. Pushed straight to
# `main` it runs afterwards, and a check that runs afterwards is a notification, not a
# gate." This file is what makes that sentence true rather than aspirational, and
# `main` is protected so that a red run here blocks the merge.
#
# Everything below runs with no cloud account and no credentials, because every claim in
# this repository is provable local. The day that stops being true, this file gets longer
# and the claims get weaker.

name: ci

# **One run per tree.** `push` is scoped to `main` so that a branch is covered by the
# `pull_request` event alone; before 2026-09-01 `push` carried no branch filter at all, and a
# push to a branch with an open PR fired *both*, entering this whole workflow twice for one
# sha.
#
# Measured over 200 runs, 2026-08-27 to 08-31, by pairing the run list on `headSha`:
#
#     118 distinct head shas, 81 of them ran under BOTH events
#     push 586 jobs 3542 min  ·  pull_request 586 jobs 3478 min
#     one whole side redundant: ~58 h of runner time in five days
#     of which claim-2 alone: 2092 min = 34.9 h, 36% of all successful claim-2 compute
#
#     gh run list --workflow=ci --limit 200 \
#        --json databaseId,event,headSha,conclusion,createdAt
#
# **What this saves is a prediction until a week of runs exists on the other side of it.** The
# 58 hours is a measurement of what was spent, not of what the fix returns.
#
# THE SECOND EFFECT, WHICH IS NOT A SAVING. Every context existed twice on every PR head sha —
# `gh api /repos/.../commits/<sha>/check-runs` returned 20 on a two-job-short workflow, every
# name doubled, including all three the `main` ruleset requires (`gate`, `secrets`,
# `claims-complete`). So each required context was resolved between two check runs of the same
# name from two different runs of one tree.
#
# **That hazard was never realised, and the honest statement is the weaker one.** All 36 merged
# pull requests carried doubled contexts at their head sha and in **zero** of them did a
# required context disagree with itself. Three self-disagreements exist in the sample — `gate`
# twice, `claim-1` once — and all three sit on commits that were superseded before the PR
# merged, so the ambiguity decided nothing. Whether the forge takes the latest check run or
# either one is **not established here** and is not guessed at: after this filter a PR head
# carries one run of each context and the question cannot arise. The fix dissolves it rather
# than answering it, which is why nobody later needs to know how it would have resolved.
#
# WHAT THIS FILTER RETIRES, WHICH IS NOT NOTHING. The duplication was also an instrument, and
# an accidental one: two independent runs of one tree on two runners, free, on every push. It is
# what established that this machinery is deterministic across machines — byte-identical result
# lines and the same sha256 — and it is where every same-tree spread figure in the record came
# from. After this filter there is one run per sha and **the pairs stop being produced**.
#
# That is not an argument against the fix: 58 h is an absurd price for a comparison, and the
# measurements are already taken. But a later session reading *the same tree produces the same
# numbers on different machines* would go looking for the pairs behind it and find a repository
# that no longer makes them, so the evidence is named as HISTORICAL and the way to make more of
# it deliberately is named beside it: **`workflow_dispatch` the same sha twice.**
#
# And the record under-counted its own instrument. `docs/FINDINGS.md` reasoned from two pairs and
# the reviewing session recalled five; re-pulled from the 200-run sample, `claim-2` succeeded
# under both events on **35 shas** — 35 same-tree, two-runner comparisons, of which the register
# had noticed five:
#
#     ratio max/min over 35 pairs:  min 1.00 · median 1.10 · max 1.69
#
# The conclusion those pairs were used for is unchanged and better supported — the distribution
# to size a budget against is the distribution over runners. What is new is that a measurement
# nobody had to ask for was arriving on every push, and the fix is the moment to say so, because
# afterwards there is nothing to notice.
#
# THE TRADE, AND ITS EXPOSURE IS ZERO RATHER THAN SMALL. A push to a branch with no open PR now
# runs nothing. `pull_request` fires on `synchronize`, so every push *after* a PR opens is still
# covered — visible in the sample as the 81 shas that carry a `pull_request` run, which are
# second-and-later pushes. Only the first push of a branch, before its PR exists, is uncovered:
# **3 of 118 shas**, and a branch with no pull request merges nothing into `main`. Nothing that
# can reach `main` is less covered than it was.
#
# **`pull_request` CARRIES NO BRANCH FILTER, AND THAT IS THE CORRECTION THE FIRST DRAFT NEEDED.**
# It read `branches: [main]`, which is the spelling every example uses and which was wrong here
# within the hour: with `push` scoped to `main`, a pull request opened against **any other base**
# matched neither event and got **no CI at all**. It was found by this branch's own successor —
# `#40`, stacked on `#39` — reporting *no checks reported on the branch*, and before that change
# the unscoped `push` had been covering that case by accident.
#
# So the paragraph above was right about what it examined and wrong about what exists: it
# measured *a push with no pull request* and never asked about *a pull request whose base is not
# `main`*. **A guard tested by its author is tested in the shape the author pictured**, and the
# shape here was the one this repository's own workflow produces the moment two pieces of work
# stack. The prior wording stays per doctrine rule 4; the exposure it claims is only true with
# the filter removed.
#
# Unfiltered costs nothing and doubles nothing: `push` fires only on `main`, so a branch's pull
# request produces exactly one run whatever it targets, and a merge into `main` produces exactly
# one more.
on:
  push:
    branches: [main]
  pull_request:

# A pull request and the push that created it are separate groups on purpose: collapsing
# them would let one cancel the other, and the cancelled one is sometimes the required check.
#
# **Restated 2026-09-01, and the comment above it is why.** With `push` unscoped the two runs
# it names were two runs of the *same sha*, and keeping them in separate groups is what let
# both complete — which, read against the merge heads, is the reason no merge ever saw the two
# disagree. The mechanism worked; what was wrong was that there were two runs to protect from
# each other. Scoping `push` to `main` means a branch sha now produces one run and this group
# separates a `main` push from a pull request, which are genuinely different trees. The prior
# wording stays per doctrine rule 4, and the delta is the finding: **a mechanism that manages a
# symptom correctly can outlive the cause, and reads as load-bearing while it does.**
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The lockfile is an input, not an artefact: every `uv` invocation below asserts that
  # uv.lock is up to date with pyproject.toml and refuses to re-resolve. A lockfile that has
  # drifted is a red build, not a silent upgrade.
  #
  # UV_LOCKED rather than UV_FROZEN, and the difference is the whole point: FROZEN means
  # "use the lockfile as it is", which would pass on a lockfile that no longer matches
  # pyproject.toml. LOCKED means "the lockfile must already be correct". The first run of
  # this workflow used FROZEN and died on its own contradiction with `uv sync --locked`,
  # which is a better outcome than the two quietly disagreeing.
  UV_LOCKED: "1"

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # `make check` is seconds. It was minutes while this job also ran every claim target,
    # and that is what the matrix below took away: `gate` is now the suite, the contracts and
    # the expiry check, and nothing that generates a world or plants a mutation.
    #
    # **Back to 15, which is what T003 owed.** The history: 30 while `claim-1` and
    # `gate-proof` both ran claim 1's mutations and the job took 13m06s; 15 once each mutation
    # ran once; 25 from T000, on measured runner variance — 11m00s passing and 15m16s cancelled
    # on the same commit, which is ~40% spread on identical work and a budget only the fast
    # runner fits. T003's `stop_at` said the answer was to split the claim targets into their
    # own jobs rather than to raise it a third time, and that is what happened. The deferral
    # in `docs/DECISIONS.md` that carried the 25 is closed in this change.
    #
    # **And it was cancelled at 15 once, with this number correct and the suite wrong.** The
    # branch that sharded claim 2 put `tests/evals/test_uplift_shards.py` into `make check`:
    # measured on one machine, cold, that took the suite from 1m36s to 8m14s, of which ~200s is
    # generating machinery worlds this job caches nowhere. Run 33483742285 cancelled `make
    # check` at 907s with the whole shard matrix already green. Raising the budget would have
    # been the third raise, and the second one that hid a suite doing work the target's own
    # closing line says it does not do; the file is marked `claim_2` and runs behind claim 2
    # instead, and `make check` came back to 1m32s. The number is unchanged and is now measured
    # against a suite that fits it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: install exactly what uv.lock pins
        run: make setup-locked

      # `make check` is the whole local gate - the same command a session runs before it
      # commits. Running the identical target here is the point: if CI and a laptop can
      # disagree, the laptop stops being evidence.
      - name: make check
        run: make check

      # Deliberately overlapping with `make check`, which already ran it. `make contracts`
      # is what claims 1, 5 and 6 rest on, and naming it as its own step means a contract
      # failure is legible in the checks list instead of buried in a composite target.
      - name: make contracts
        run: make contracts

      # Also deliberately overlapping with `make check`. `make expiry` is the one target in
      # the repository that can go red on a day nobody pushed anything — a deferral outlives
      # its reason by the calendar, not by an edit — so when it does go red it has to be
      # legible as itself rather than as "make check failed".
      - name: make expiry
        run: make expiry

  # Reads the claim targets out of the **Makefile** and emits them as a matrix. The
  # discovery property is the whole point and it survives the restructure unchanged: the
  # targets are never listed in this file, so a claim target that exists but is never run
  # stays impossible by construction. `claim-1` and `gate-proof` both arrived that way
  # without this file changing to admit them, and `claim-2` arrives the same way.
  discover:
    name: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.read.outputs.targets }}
      any: ${{ steps.read.outputs.any }}
      combines: ${{ steps.read.outputs.combines }}
      any_combine: ${{ steps.read.outputs.any_combine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          set -euo pipefail
          targets="$(grep -oE '^(claim-[0-9]+|gate-proof|preview-audit):' Makefile \
                     | tr -d ':' | sort -u || true)"
          # The floor. `claim-[0-9]+` cannot miss a claim target the way `claim-[1-7]` could,
          # but a target that is *deleted* still shrinks this list in silence, and a shrinking
          # gate is the same lie one step along. FLOOR is what exists today; finding more is
          # ordinary growth and finding fewer is a claim whose gate stopped running.
          # `make figures` checks this number against the Makefile, so it cannot go stale
          # downward without something going red.
          FLOOR=6
          found="$(printf '%s\n' $targets | grep -c . || true)"
          if [ "$found" -lt "$FLOOR" ]; then
            echo "::error::discover found $found claim target(s), below the declared floor of $FLOOR."
            echo "A target that stops being discovered is a gate that stops running, and"
            echo "claims-complete aggregates only what this step emits."
            exit 1
          fi

          if [ -z "$targets" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            {
              echo "### Claim targets"
              echo ""
              echo "None exist yet. The Makefile declares them deliberately absent:"
              echo "a green target that proves nothing is a gate disarmed before it was armed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"

          # How many machines each target's work is produced on, read out of the **Makefile**
          # the same way the target names are. The variable name is derived mechanically from
          # the target -- `claim-2` -> `CLAIM_2_SHARDS` -- so this file still names no claim and
          # no shard count. A target with no such variable runs whole, as every target did
          # before sharding existed.
          #
          # The alternative was declaring the count here, which would be a second registry of
          # which claims are sharded, kept by hand, in the file `discover` exists so that
          # nobody has to keep one.
          entries=""
          combines=""
          for t in $targets; do
            var="$(printf '%s' "$t" | tr 'a-z-' 'A-Z_')_SHARDS"
            n="$(grep -oE "^${var}[[:space:]]*:=[[:space:]]*[0-9]+" Makefile \
                 | grep -oE '[0-9]+$' || true)"
            n="${n:-1}"
            if [ "$n" -le 1 ]; then
              entries="$entries$(jq -nc --arg t "$t" \
                        '{target:$t,shard:"",slug:"",name:$t}')\n"
            else
              combines="$combines $t"
              for i in $(seq 1 "$n"); do
                entries="$entries$(jq -nc --arg t "$t" --arg s "$i/$n" \
                          --arg slug "$i-of-$n" --arg name "$t $i/$n" \
                          '{target:$t,shard:$s,slug:$slug,name:$name}')\n"
              done
            fi
          done
          echo "targets=$(printf "$entries" | jq -sc .)" >> "$GITHUB_OUTPUT"

          if [ -z "$combines" ]; then
            echo "any_combine=false" >> "$GITHUB_OUTPUT"
            echo "combines=[]" >> "$GITHUB_OUTPUT"
          else
            echo "any_combine=true" >> "$GITHUB_OUTPUT"
            echo "combines=$(printf '%s\n' $combines | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Claim targets"
            echo ""
            for t in $targets; do
              var="$(printf '%s' "$t" | tr 'a-z-' 'A-Z_')_SHARDS"
              n="$(grep -oE "^${var}[[:space:]]*:=[[:space:]]*[0-9]+" Makefile \
                   | grep -oE '[0-9]+$' || true)"
              if [ -n "$n" ] && [ "$n" -gt 1 ]; then
                echo "- \`make $t\` — $n shard(s), then \`make $t-combine\`"
              else
                echo "- \`make $t\`"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # One runner per claim, which is what makes claim 2 possible at all: it runs the whole
  # system per draw at K = 200 across six adversarial worlds and then plants eight mutations
  # against the same checks at a smaller configuration.
  #
  # `fail-fast: false` because a red claim 2 must not hide the state of claim 1. They are
  # separate assertions about separate machinery and one failing tells you nothing about
  # the other.
  claims:
    # **`matrix.name`, not `matrix.target`.** The job name is the check-run context name, so
    # eight shards under `${{ matrix.target }}` would put **eight contexts called `claim-2`** on
    # one sha — which is precisely the duplication `#39` removed, reintroduced by this change at
    # eight times the count. It was found by reading the first sharded run's job list rather
    # than the checks list, which collapses same-named contexts and showed nine where there
    # were sixteen.
    name: ${{ matrix.name }}
    needs: [discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    # TEMPORARY, and set from measurement — including one measurement of this number being
    # wrong. `make claim-2` is 1h11m cold on a fourteen-core laptop: 32 minutes for the
    # published harness at K = 200 and the rest for one baseline plus eight mutated runs. It
    # was first set at 45 on a projection, and the runner cancelled the harness before it
    # finished, which is what a projection is worth against four cores.
    #
    # 90 is the cold number with the headroom the spread between runners demands. Measured
    # 2026-08-31 over **71 successful claim-2 jobs** pulled from the Actions API rather than
    # from any paragraph: min 32.2, median 53.8, max 78.3, sd 10.0, spread 2.43x. The maximum
    # has moved once since the previous summary said 77.1, which is why it is re-pulled rather
    # than quoted.
    #
    # **The cache is worth what it claimed to be worth, and it was the measurement that was
    # missing.** Split by whether the job logged a world-cache hit:
    #
    #     warm  n=60  median 50.8  mean 49.8  sd  7.0
    #     cold  n=11  median 70.0  mean 68.2  sd 10.2
    #     cold - warm = +18.4 min, 95% CI +13.5 to +23.2, t = 7.43
    #
    # All 71 jobs share one digest over the sources that can change a world, so the cold arm
    # computed exactly what the warm arm computed.
    #
    # WHAT THAT NUMBER IS, AND WHAT IT IS NOT. Every cold run in the sample was a SPURIOUS
    # invalidation — the key moved for a change that could not alter a world. So 18.4 is what a
    # spurious invalidation COSTS, not what the cache SAVES. They share a number here only
    # because no run in this sample ever needed to regenerate. Where the world sources genuinely
    # change, regeneration is necessary work no cache can save, and the 18.4 becomes a cost that
    # must be paid. The sample lies inside one world-source epoch and says nothing about the
    # other case, because there are no runs of it to compare.
    #
    # The steady state is therefore around 50 minutes rather than 68, and this budget is not
    # lowered to it: 90 is a ceiling against the slowest draw, and the slowest draw observed is
    # a **cold** 78.3. A budget set from the warm steady state is a budget that fails whenever
    # the key moves, which it has done eleven times in this sample.
    #
    # It is this job's timeout and not the `gate` one: `TASKS.md`'s instruction was that the
    # gate does not go up a third time, and it came back down to 15 in the same change that
    # created this job — measured at 2m33s on the first run under the new topology.
    #
    # **The budget is per matrix target, and `claim-3` shares it without re-sizing it.** Claim 3
    # is 3m14s cold on the same fourteen-core laptop — ten runs of a seventeen-second eval, one
    # baseline and nine mutations, with no world to generate because a chain is placement
    # arithmetic. That is an order of magnitude under the number above, so the headroom claim 2
    # needed covers it several times over rather than being projected onto it. If a later claim
    # target arrives that is not obviously inside this budget, it gets its own cold measurement
    # on a runner before it gets a number here.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: install exactly what uv.lock pins
        run: make setup-locked

      # Claim 2 generates its worlds once per command and reads them back — `.worlds/`, keyed
      # on a digest of the corpus and of the two modules that group it. This carries that one
      # layer further out, across runs, and it is the same guarantee rather than a weaker one:
      # **the cache key is the digest itself**, computed by the code that decides what a stale
      # entry is, so a changed corpus is a cache miss here for exactly the reason it is a miss
      # inside a run. Nothing else may reuse it, and a claim target that generates nothing
      # simply never writes one.
      - name: the digest claim 2's world cache is keyed on
        id: worlds
        run: echo "digest=$(uv run python -c 'from evals.uplift import cache; print(cache.source_digest())')" >> "$GITHUB_OUTPUT"

      # **One writer per key, by construction rather than by accident.**
      #
      # Until sharding there was exactly one job that generated worlds, so one key had one
      # writer and nobody had to say so. `actions/cache` is first-writer-wins — it reserves a
      # key and a later job that finds it taken skips saving, which is visible in run
      # 33457341968 where `claim-2` saved at 01:59:34 and `claim-3` ended at 01:13:25 having
      # saved nothing. With N shards on one key, the first shard to finish would take it with
      # its own partial slice and the complete set would never be written at all.
      #
      # So a shard's cache is namespaced by its slug. **The digest is the same one** the
      # unsharded key uses and the combine key uses: same invalidation, different namespace. A
      # combine key derived from anything narrower would let a world-source change move the
      # shard keys while leaving the combine restoring counterfactual worlds built by the
      # previous generator — not a slow run, a **wrong answer with no red**, which is the
      # failure T00G's narrowing warning names, in the key this change adds.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .worlds
          key: worlds-${{ runner.os }}-${{ steps.worlds.outputs.digest }}${{ matrix.slug && format('-shard-{0}', matrix.slug) || '' }}

      - name: make ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.shard }}" ]; then
            make ${{ matrix.target }}-shard SHARD=${{ matrix.shard }}
          else
            make ${{ matrix.target }}
          fi

      # A shard's draws, on their way to whatever combines them. Named by the slug so the
      # combine step can take every one of them and `gather` can refuse a set that is not the
      # whole — which is the shape this matrix produces whenever one leg fails.
      #
      # **`include-hidden-files`, because `.shards` is a hidden directory.** Since v4.4 this
      # action filters every path whose name begins with a dot *before* the glob is judged, so
      # the first sharded run wrote `.shards/uplift-1-of-8.pickle` on all eight machines, saw
      # the flag default to false in its own printed inputs, and reported `No files were found
      # with the provided path`. Eight runners spent eleven to sixteen minutes each and the
      # work was discarded at the last step. The `error` setting one line below is what made it
      # a red run rather than a combine over nothing, and it stays.
      #
      # The alternative was renaming the directory. The flag is local to the one step that
      # needs it; the rename would have touched the Makefile, `.gitignore`, two docstrings and
      # the tests, and dropped the convention `.worlds/` already sets.
      - if: matrix.shard != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draws-${{ matrix.target }}-${{ matrix.slug }}
          path: .shards/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Where a sharded target's checks actually run: **once, over every draw**. The split moves
  # where draws are produced and nothing else, so no rate is ever computed over a denominator
  # that a shard boundary changed.
  #
  # `evals/uplift/checks.py`'s `gather` refuses a set that is not the whole one rather than
  # averaging over what arrived, because `U1`'s `8/200` computed over 150 draws is still a
  # number and nothing downstream would know. That refusal is what makes a failed shard a red
  # run rather than a smaller experiment reported as the whole one.
  #
  # **This job carries a ten-minute cold penalty and it is cached rather than removed.**
  # Measured on this repository's corpus: a cold combine is 596s against 1s warm, of which
  # `_truths` — the counterfactual generations, which no draw shard produces — is 411s, `U11`
  # 195s and `U10` 51s. It is paid once per world-source change. Removing it means moving the
  # counterfactual generations into the shards, which `docs/FINDINGS.md` records as its own
  # branch together with the reason it is safe to do.
  combine:
    name: ${{ matrix.target }} combine
    needs: [discover, claims]
    if: needs.discover.outputs.any_combine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.combines) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: install exactly what uv.lock pins
        run: make setup-locked

      - name: the digest claim 2's world cache is keyed on
        id: worlds
        run: echo "digest=$(uv run python -c 'from evals.uplift import cache; print(cache.source_digest())')" >> "$GITHUB_OUTPUT"

      # The same digest as every shard key, a different namespace. See the note on the shard
      # cache above: the contents differ, the dependency does not.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .worlds
          key: worlds-${{ runner.os }}-${{ steps.worlds.outputs.digest }}-combine

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: draws-${{ matrix.target }}-*
          path: .shards/
          merge-multiple: true

      - name: make ${{ matrix.target }}-combine
        run: make ${{ matrix.target }}-combine

  # The one job the ruleset requires on behalf of every claim, and it exists because the
  # ruleset could not require the matrix itself.
  #
  # **What it was found by, because it was found by nothing here.** Until T003 the claim
  # targets ran inside `gate`, and `gate` is what the `main` ruleset requires. T003 split them
  # into the matrix above — correctly, and for reasons that file's own comments give — and the
  # ruleset stayed pointing at `gate`. From that commit until this one, **a pull request with a
  # red `claim-2` merged**: oversight level 1's whole sentence, *a session cannot merge
  # something that breaks a claim, because the gate is structural rather than advisory*, was
  # false for two days and nothing in the repository could say so. What the ruleset requires is
  # a fact about the forge, not about this tree: no file carries it, `make check` cannot read
  # it, and no amount of reading `ci.yml` reveals it. It was found by asking the API.
  #
  # **`if: always()` with `needs: [claims]`, and it fails on anything that is not success.** A
  # required check that only reports when it runs is not required; it is required *when
  # convenient*. The result of a matrix job aggregates its legs, so `failure` covers a red
  # claim — but the one that matters is `skipped`, because **skipping is how a matrix job
  # passes silently**. `claims` is skipped whenever `discover` emits no targets or fails
  # outright, and a skipped required check is reported as neutral rather than red. Deleting
  # every `claim-N:` line from the Makefile would have left this repository with a green tick
  # and no claim proved. That is refused here by name.
  #
  # **The ruleset requires this context and never the target names.** Enumerating
  # `claim-1 … claim-7` there would be a second registry of which claims exist, kept by hand,
  # in a place no session reads and no test can see — and the day `claim-5` lands somebody has
  # to remember to add it. `discover` already reads the targets out of the Makefile, which is
  # what CI runs; this job is the single context that summarises whatever `discover` found. A
  # new claim is covered on the day its target is written, by nobody remembering anything.
  #
  # **What this does not catch:** the ruleset itself. If the required context is removed from
  # it tomorrow, this job goes on reporting and nothing turns red — the same class of hole one
  # layer out, and the reason *"what does the ruleset require?"* is a question the
  # `integration-review` skill asks out loud rather than a thing a future reviewer might
  # notice. It cannot be noticed by reading.
  claims-complete:
    name: claims-complete
    needs: [discover, claims, combine]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # **Both matrices, and `skipped` refused on both.** A sharded target proves nothing until
      # its combine job has run: the shards produce draws and judge nothing, deliberately, so a
      # green `claims` matrix with no `combine` is eight jobs that wrote files and checked no
      # claim. That is the same silence `skipped` carries one job along, and it is refused here
      # for the same reason.
      #
      # `combine` is legitimately skipped when no target declares shards — `any_combine` is
      # then false — so that one case is admitted by name rather than by treating `skipped` as
      # acceptable in general.
      - name: every claim target ran, and every one of them passed
        env:
          RESULT: ${{ needs.claims.result }}
          COMBINE: ${{ needs.combine.result }}
          ANY_COMBINE: ${{ needs.discover.outputs.any_combine }}
        run: |
          set -euo pipefail
          echo "claims matrix result:  ${RESULT}"
          echo "combine matrix result: ${COMBINE} (any_combine=${ANY_COMBINE})"
          if [ "${COMBINE}" != "success" ]; then
            if [ "${ANY_COMBINE}" = "true" ] || [ "${COMBINE}" != "skipped" ]; then
              {
                echo "### claims-complete FAILED"
                echo ""
                echo "The \`combine\` matrix result was \`${COMBINE}\`, and a sharded target"
                echo "proves nothing until it has run: the shards produce draws and judge"
                echo "nothing. A green shard matrix with no combine is jobs that wrote files"
                echo "and checked no claim."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          if [ "${RESULT}" = "success" ]; then
            echo "OK      every discovered claim target ran and passed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### claims-complete FAILED"
            echo ""
            echo "The \`claims\` matrix result was \`${RESULT}\`, not \`success\`."
            echo ""
            case "${RESULT}" in
              failure)
                echo "At least one claim target is red. A claim that does not prove itself is"
                echo "not a claim, and this pull request does not merge."
                ;;
              skipped)
                echo "The matrix did not run at all. Either \`discover\` found no \`claim-N\`"
                echo "target in the Makefile, or it failed before it could emit one. **A"
                echo "skipped matrix is how a gate passes silently** — it is refused here"
                echo "rather than reported as neutral."
                ;;
              *)
                echo "The matrix neither succeeded nor failed cleanly. Anything that is not"
                echo "\`success\` is refused: a required check that reports green on an"
                echo "outcome nobody examined is worse than a missing one."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a key committed and then removed is still a leaked key, and a
      # shallow clone would report the repository clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CLAUDE.md: "No long-lived credentials. OIDC for CI, service principals for
      # services, `gitleaks` on push." A rule enforced by intention is not enforced.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
