[project]
name = "holdout"
version = "0.1.0"
description = "Pricing decisions that prove whether they made money."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The contract layer is allowed exactly two third-party imports. `src/holdout/core/`
# is allowed neither — see src/holdout/core/__init__.py and tests/boundary/.
contracts = [
    "PyYAML>=6.0.2",
    "jsonschema>=4.23.0",
]
# The engine `pipelines/silver/` runs on, and **not in the dev group**, which is the
# whole point: `uv sync` installs the dev group and does not install an extra, so this
# lands on the one CI job that runs silver's tests rather than on the thirteen that call
# `make setup-locked`. Measured before it was chosen: 429.3 MiB downloaded and **713 MB
# installed** on macOS arm64 (pyspark 471 MB, pyarrow 122 MB, pandas 40 MB, grpc 38 MB),
# plus a JVM — against pyarrow's 122 MB, which was the number that made pyarrow worth a
# paragraph of its own.
#
# **A test that cannot import this is a red run, never a skip**, and that is not left to
# discipline: `tests/boundary/test_the_engine_is_never_skipped.py` refuses the two
# spellings that would turn an absent engine into a green one.
spark = [
    "pyspark[pipelines]>=4.1.0",
    "delta-spark>=4.0.0",
]
# The engine `pipelines/gold/` runs on, and it **contains** `spark` rather than sitting
# beside it: dbt-spark's `session` method drives the SparkSession this repository already
# starts, so a tree that asked for dbt and not for Spark could not run a single model.
#
# Measured before it was chosen, on macOS arm64 / CPython 3.12.13, on top of a tree that
# already has `spark` — so pyspark, pyarrow and pandas are excluded from the figure:
# **45 packages and 196.1 MiB installed**, the largest being babel 33 MB (pulled by
# metricflow), networkx 8 MB and dbt 6 MB. dbt-core 1.12.3, dbt-spark 1.11.0. The Linux
# figure this repository's CI actually pays is in this branch's pull request rather than
# projected here.
#
# **It is not a new architectural choice and it is not an escape from one.** `CLAUDE.md`
# names dbt as the silver -> gold engine, and `docs/DECISIONS.md` scheduled the generated
# SQL's first execution for the moment gold was built. What is new is one number, and it
# lands on **one CI job of twenty** — the same arrangement `spark` already has.
dbt = [
    "holdout[spark]",
    "dbt-core>=1.12.3",
    "dbt-spark[session]>=1.11.0",
]

[project.scripts]
holdout-contracts = "holdout.contracts.cli:main"

[dependency-groups]
# `pyarrow` is here and nowhere else, and it is read rather than written with: it is the
# independent reader `corpus/world/parquet.py` is checked by. That writer is stdlib, so no
# runtime path in this repository imports pyarrow -- `tests/corpus/test_world_parquet.py` and
# `tests/pipelines/test_bulk_load.py` do, and they are the only ones. The rule it serves is
# CLAUDE.md's: a guard tested by its author is tested in the shape the guard already handles,
# and a round-trip through our own reader would have agreed with our own writer about a
# timestamp column that pyarrow read as `time64[us]`.
dev = [
    "holdout[contracts]",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "pyarrow>=21.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdout"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals", "corpus", "ops", ".claude/hooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
    "TID",  # tidy imports
    "ARG",  # unused arguments
    "DTZ",  # naive datetimes
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

# This repository quotes Greek statute, so Greek letters that resemble Latin ones appear in
# docstrings and test assertions on purpose. RUF001-003 would flag most of the alphabet.
# Listing the confusables rather than switching the rules off keeps the check alive for a
# Cyrillic homoglyph slipped into an identifier, which is what it is actually for.
allowed-confusables = [
    "\u0391", "\u0392", "\u0395", "\u0396", "\u0397", "\u0399", "\u039a", "\u039c",
    "\u039d", "\u039f", "\u03a1", "\u03a4", "\u03a5", "\u03a7",
    "\u03b1", "\u03b5", "\u03b7", "\u03b9", "\u03ba", "\u03bc", "\u03bd", "\u03bf",
    "\u03c1", "\u03c4", "\u03c5", "\u03c7", "\u03ac", "\u03ad", "\u03af", "\u03cc",
    "\u03cd", "\u0384", "\u00b7",
    # \u00d7 MULTIPLICATION SIGN. The evals write arithmetic in prose — `cost x (1 - m)` reads
    # as a variable named x, and the whole point of those docstrings is that the derivation
    # can be checked by eye.
    "\u00d7",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
# The eval reaches for `object.__setattr__` and reads `_witness`-adjacent slots on purpose:
# `G9` attacks the certificate through the one route `certificate.py` declares open and does
# not pretend to have closed. Forbidding that here would forbid the attack, not the forgery.
"evals/guardrail/checks.py" = ["SLF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "evals", "corpus", "ops", "pipelines", ".claude/hooks"]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = ["jsonschema.*", "pyarrow.*", "pyspark.*", "delta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["src"]
# A mark here says "this test belongs to a claim target rather than to the suite". Registered
# rather than free-form because `--strict-markers` is on: an unregistered mark is a typo that
# would silently select nothing, and a mark that selects nothing is a test that runs nowhere.
# What stops that being a hole is `ops/figures.py`'s `suite` row, which requires every test
# `make test` deselects to be selected by some `claim-*` target.
markers = [
  "silver: needs the `spark` extra — the engine `pipelines/silver/` runs on, which `uv sync` does not install. Run by `make silver`, and by the one CI job that syncs the extra.",
  "gold: needs the `dbt` extra — dbt-core and dbt-spark[session], which contain the `spark` extra. Run by `make gold`, and by the one CI job that syncs it.",
  "claim_2: claim 2's own evidence — minutes, and it generates worlds. Run by `make claim-2` and by `make claim-2-combine`, which is the one CI runs for a sharded target.",
]

[tool.coverage.run]
source = ["src/holdout", "evals", "corpus", "ops", "pipelines"]
branch = true
