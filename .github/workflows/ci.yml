# The gate.
#
# CLAUDE.md: "On a branch, the suite runs *before* anything lands. Pushed straight to
# `main` it runs afterwards, and a check that runs afterwards is a notification, not a
# gate." This file is what makes that sentence true rather than aspirational, and
# `main` is protected so that a red run here blocks the merge.
#
# Everything below runs with no cloud account and no credentials, because every claim in
# this repository is provable local. The day that stops being true, this file gets longer
# and the claims get weaker.

name: ci

on:
  push:
  pull_request:
    branches: [main]

# A pull request and the push that created it are separate groups on purpose: collapsing
# them would let one cancel the other, and the cancelled one is sometimes the required check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The lockfile is an input, not an artefact: every `uv` invocation below asserts that
  # uv.lock is up to date with pyproject.toml and refuses to re-resolve. A lockfile that has
  # drifted is a red build, not a silent upgrade.
  #
  # UV_LOCKED rather than UV_FROZEN, and the difference is the whole point: FROZEN means
  # "use the lockfile as it is", which would pass on a lockfile that no longer matches
  # pyproject.toml. LOCKED means "the lockfile must already be correct". The first run of
  # this workflow used FROZEN and died on its own contradiction with `uv sync --locked`,
  # which is a better outcome than the two quietly disagreeing.
  UV_LOCKED: "1"

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # `make check` is seconds. It was minutes while this job also ran every claim target,
    # and that is what the matrix below took away: `gate` is now the suite, the contracts and
    # the expiry check, and nothing that generates a world or plants a mutation.
    #
    # **Back to 15, which is what T003 owed.** The history: 30 while `claim-1` and
    # `gate-proof` both ran claim 1's mutations and the job took 13m06s; 15 once each mutation
    # ran once; 25 from T000, on measured runner variance — 11m00s passing and 15m16s cancelled
    # on the same commit, which is ~40% spread on identical work and a budget only the fast
    # runner fits. T003's `stop_at` said the answer was to split the claim targets into their
    # own jobs rather than to raise it a third time, and that is what happened. The deferral
    # in `docs/DECISIONS.md` that carried the 25 is closed in this change.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: install exactly what uv.lock pins
        run: make setup-locked

      # `make check` is the whole local gate - the same command a session runs before it
      # commits. Running the identical target here is the point: if CI and a laptop can
      # disagree, the laptop stops being evidence.
      - name: make check
        run: make check

      # Deliberately overlapping with `make check`, which already ran it. `make contracts`
      # is what claims 1, 5 and 6 rest on, and naming it as its own step means a contract
      # failure is legible in the checks list instead of buried in a composite target.
      - name: make contracts
        run: make contracts

      # Also deliberately overlapping with `make check`. `make expiry` is the one target in
      # the repository that can go red on a day nobody pushed anything — a deferral outlives
      # its reason by the calendar, not by an edit — so when it does go red it has to be
      # legible as itself rather than as "make check failed".
      - name: make expiry
        run: make expiry

  # Reads the claim targets out of the **Makefile** and emits them as a matrix. The
  # discovery property is the whole point and it survives the restructure unchanged: the
  # targets are never listed in this file, so a claim target that exists but is never run
  # stays impossible by construction. `claim-1` and `gate-proof` both arrived that way
  # without this file changing to admit them, and `claim-2` arrives the same way.
  discover:
    name: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.read.outputs.targets }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          set -euo pipefail
          targets="$(grep -oE '^(claim-[1-7]|gate-proof|preview-audit):' Makefile \
                     | tr -d ':' | sort -u || true)"
          if [ -z "$targets" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            {
              echo "### Claim targets"
              echo ""
              echo "None exist yet. The Makefile declares them deliberately absent:"
              echo "a green target that proves nothing is a gate disarmed before it was armed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "targets=$(printf '%s\n' $targets | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          {
            echo "### Claim targets"
            echo ""
            for t in $targets; do echo "- \`make $t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # One runner per claim, which is what makes claim 2 possible at all: it runs the whole
  # system per draw at K = 200 across six adversarial worlds and then plants eight mutations
  # against the same checks at a smaller configuration.
  #
  # `fail-fast: false` because a red claim 2 must not hide the state of claim 1. They are
  # separate assertions about separate machinery and one failing tells you nothing about
  # the other.
  claims:
    name: ${{ matrix.target }}
    needs: [discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    # TEMPORARY, and set from measurement rather than from hope. On the author's laptop
    # `make claim-2` is about twenty minutes: eleven for the published harness at K = 200 and
    # nine for one uncached baseline plus eight mutated runs. A GitHub runner has four cores
    # against fourteen and is slower per core, and the spread between runners on identical
    # work has already been measured at ~40% once — so this carries the headroom that spread
    # demands and no more.
    #
    # It is a job timeout and not the `gate` one: `TASKS.md`'s instruction was that the gate
    # does not go up a third time, and it has come back down to 15 in this same change. The
    # deferral in `docs/DECISIONS.md` carries this number with a review date, exactly as the
    # last one did, so it expires by the calendar rather than by somebody remembering.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: install exactly what uv.lock pins
        run: make setup-locked

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a key committed and then removed is still a leaked key, and a
      # shallow clone would report the repository clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CLAUDE.md: "No long-lived credentials. OIDC for CI, service principals for
      # services, `gitleaks` on push." A rule enforced by intention is not enforced.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
