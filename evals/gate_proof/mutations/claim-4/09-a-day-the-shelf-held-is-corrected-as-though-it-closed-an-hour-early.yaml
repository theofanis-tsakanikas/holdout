    if isinstance(reading, FullyObserved):
        return DemandEstimate(
            at_least=reading.units,
            units=reading.units,
            censored=False,
            observed_share=Fraction(1),
        )
replacement: |
    if isinstance(reading, FullyObserved):
        whole_day = curve.share_before(curve.window.close_hour - 1)
        return DemandEstimate(
            at_least=reading.units,
            units=round_half_even(Fraction(reading.units) / whole_day),
            censored=False,
            observed_share=whole_day,
        )
