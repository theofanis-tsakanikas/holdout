# the laptop against a recording with one interference refusal; on CI, against the committed
# recording with two -- a store_category and a store_week -- admitting one unit left the code
# reached by the other, and the mutation SURVIVED. A gate can only be shown to bite where it
# is the gate that refuses, and D7's population is the recording's designs; D9's is every
# unit against the contract, which is the population this break lives in.

