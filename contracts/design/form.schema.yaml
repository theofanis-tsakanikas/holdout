# The experiment design form.
#
# Nine fields, plus the attribution stamp. A human, a declared policy or the agent may
# fill the nine; the engine does not know and does not care which. Same checks, same
# refusals, same experiment.
#
# Two of the nine are marked `x-never-filled-by: [agent]`. The agent proposes how we will
# find out. Never what we will do once we know.
#
# Three closed lists are NOT written out here. `x-closed-list` names where they come from,
# and the compiler resolves them into generated/design/form.schema.json. A hand-written
# enum in this file would be a second definition of the metric contract, which is the one
# thing the contract layer exists to prevent.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://holdout.local/contracts/design/form.schema.json"
title: Experiment design form
type: object
additionalProperties: false

x-design-fields:
  - hypothesis
  - intervention
  - scope
  - primary_metric
  - unit
  - mde
  - max_duration
  - exclusions
  - decision_rule

required:
  - hypothesis
  - intervention
  - scope
  - primary_metric
  - unit
  - mde
  - max_duration
  - exclusions
  - decision_rule
  - filled_by

properties:

  hypothesis:
    description: >-
      One precise sentence — what changes, on what, measured by what. Imprecision here is
      not caught by any later check, because every later check takes the hypothesis as given.
    type: string
    minLength: 30
    maxLength: 300

  intervention:
    description: >-
      What the two arms actually are. Control is never "nothing": the holdout runs the
      existing policy, because comparing against abandonment would inflate every uplift.
    type: object
    additionalProperties: false
    required: [treatment, control]
    properties:
      treatment:
        type: string
        x-closed-list: policy_refs
      control:
        type: string
        x-closed-list: policy_refs

  scope:
    description: Which categories, products and stores the experiment may touch.
    type: object
    additionalProperties: false
    required: [categories, stores]
    properties:
      categories:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 2 }
      products:
        description: Null means every product in the named categories.
        oneOf:
          - type: "null"
          - type: array
            minItems: 1
            uniqueItems: true
            items: { type: string, minLength: 1 }
      stores:
        description: >-
          `all` means the whole corpus minus the exclusions. A list narrows it. Narrowing
          after the fact is what EXCLUSIONS_DEFINED_POST_HOC refuses.
        oneOf:
          - const: all
          - type: array
            minItems: 2
            uniqueItems: true
            items: { type: string, minLength: 1 }

  primary_metric:
    description: >-
      From the metric contract — a closed list, never free text. An id outside the contract
      is refused at design with METRIC_NOT_IN_CONTRACT. The version is not chosen here: the
      version in force on the design date applies, and it applies permanently to this
      experiment even after the metric is superseded.
    type: string
    x-closed-list: metric_ids

  unit:
    description: >-
      The unit of randomisation. It has no single correct answer, which is why a model may
      propose it — and whether the resulting design has the power it claims has exactly one,
      which is why code decides that.
    enum: [store, store_week, store_category, region]

  mde:
    description: >-
      The smallest difference worth detecting, declared in advance. Declared afterwards it
      is whatever the data happened to show.
    type: object
    additionalProperties: false
    required: [kind, value]
    properties:
      kind: { enum: [relative_pct, absolute] }
      value: { type: number, exclusiveMinimum: 0 }
      direction:
        description: A one-sided expectation must be declared before the period opens or not at all.
        enum: [increase, decrease, either]

  max_duration:
    description: >-
      A business constraint, not a statistical one. If the required sample does not fit
      inside it the design is refused with UNDERPOWERED_FOR_DURATION rather than quietly
      shortened.
    x-never-filled-by: [agent]
    type: object
    additionalProperties: false
    required: [weeks]
    properties:
      weeks: { type: integer, minimum: 1, maximum: 52 }

  exclusions:
    description: >-
      Store ids with reasons, declared before assignment. Every exclusion is a degree of
      freedom, so each one carries a reason that can be read back.
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [store_id, reason]
      properties:
        store_id: { type: string, minLength: 1 }
        reason: { type: string, minLength: 10 }

  decision_rule:
    description: >-
      What we will do with each outcome, declared before the period opens and applied
      unchanged when it closes. A rule that permits acting before max_duration has elapsed
      is refused with STOPPING_RULE_PERMITS_PEEKING. `if_refused` is mandatory because a
      refusal is an outcome, and a design with no plan for it invites the plan being made
      after the refusal arrives.
    x-never-filled-by: [agent]
    type: object
    additionalProperties: false
    required: [if_significant, if_not_significant, if_refused]
    properties:
      if_significant: { type: string, minLength: 10 }
      if_not_significant: { type: string, minLength: 10 }
      if_refused: { type: string, minLength: 10 }

  filled_by:
    description: >-
      Attribution, not a design field. The engine reads it, records it and ignores it when
      deciding. All three sources are first-class.
    type: string
    pattern: "^(agent|human:[A-Za-z][A-Za-z .'-]{1,60}|policy:[a-z][a-z0-9_]*)$"
